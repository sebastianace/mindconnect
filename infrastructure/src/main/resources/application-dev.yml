spring:
  # Database Configuration - PostgreSQL
  # Credenciales por variables de entorno; si no existen usa el valor después de ":"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mindconnectdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:29Abril2008}
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway maneja el esquema; Hibernate solo valida
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
    
        # El dialecto ya no se declara: Hibernate 6+ lo detecta solo desde la conexión

  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true   # nunca editar una migración ya aplicada: se crea una nueva
